---
resources:
  - name: ci-shared
    type: git
    icon: github
    source:
      uri: https://github.com/Reactive-Network/ci.git
      branch: master
      paths: [concourse/]
      username: ((github-access-token.username))
      password: ((github-access-token.password))
    check_every: 1m

  - name: app-git-concourse
    type: git
    icon: github
    source:
      uri: https://github.com/Reactive-Network/testnet-faucet.git
      branch: main
      paths: [concourse/**]
      username: ((github-access-token.username))
      password: ((github-access-token.password))
    webhook_token: ((webhook-token-testnet-faucet))
    check_every: 1m

  - name: app-git
    type: git
    icon: github
    source:
      uri: https://github.com/Reactive-Network/testnet-faucet.git
      branch: main
      username: ((github-access-token.username))
      password: ((github-access-token.password))
    webhook_token: ((webhook-token-testnet-faucet))
    check_every: 1m

  - name: builder-image
    type: registry-image
    source:
      repository: ghcr.io/reactive-network/ci-image
      tag: builder-1d296957
      username: ((ghcr-credentials.username))
      password: ((ghcr-credentials.password))

groups:
  - name: meta
    jobs: [set-self]

  - name: ci
    jobs: [unit-test]

jobs:
  - name: set-self
    plan:
      - in_parallel:
          - get: app-git-concourse
            trigger: true
          - get: ci-shared
            trigger: true
      - task: render-and-validate
        file: ci-shared/concourse/tasks/render-and-validate.yml
        input_mapping:
          pipeline-src: app-git-concourse
          ci-shared: ci-shared
        output_mapping:
          rendered: rendered
        params:
          PIPELINE_NAME: testnet-faucet
          PIPELINE_SRC_PATH: pipeline-src/concourse/pipelines/testnet-faucet.yml
          VARS_FILE: pipeline-src/concourse/vars/sample.yml
          CI_RESOURCE: ci-shared
      - set_pipeline: self
        file: rendered/pipeline.yml

  - name: unit-test
    plan:
      - in_parallel:
          steps:
            - get: app-git
              trigger: true
            - get: ci-shared
              passed: [set-self]
            - get: builder-image
      - task: unit-test
        image: builder-image
        file: app-git/concourse/tasks/unit-test.yml
        input_mapping:
          repo: app-git